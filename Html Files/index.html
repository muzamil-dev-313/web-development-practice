<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Form</title>
    <style>
        img{
            padding-top: 15px;
        }
    </style>
</head>

<body>
    <h1>Form to apply for jobs</h1>
    <form method="post">
        <div>
            <label for="username">Enter your name:</label>
            <input type="text" id="username" name="username" placeholder="Enter your name">
        </div>
        <div>
            <label for="qualification">Enter your qualification:</label>
            <input type="text" id="qualification" name="qualification" placeholder="Enter your qualification">
        </div>
        <div>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="male" name="gender" value="female">
            <label for="female">Female</label>
        </div>
        <div>
            <input type="checkbox" id="subscribe" name="subscribe" value="yes">
            <label for="subscribe">Read the form carefully then check the button</label>
        </div>
        <div>
            <label for="comment">Write your comment below in this section </label>
            <br>
            <textarea id="comment" name="comment" cols="50" rows="5"
                placeholder="Write your comment here..."></textarea>
        </div>
        <div>
            <select name="fruits">
                <option value="OptionA">OptionA</option>
                <option value="OptionA">OptionB</option>
                <option value="OptionA">OptionC</option>
                <option value="OptionA">OptionD</option>
            </select>
        </div>
        <!-- Question
    Without using br tag, write a vertically aligned form asking for name, city and pincode of a user.
    Everyone must comment -->
        <div>
            <form action="post">
                <div> <label for="username">Enter your name</label>
                </div>
                <input type="text" id="username" name="username" placeholder="Enter your name ">
                <div>
                    <div>
                        <label for="city">Enter your city name</label>
                    </div>
                    <input type="text" id="city" name="city" placeholder="Enter your city name">
                </div>
                <div>
                    <legend>
                        <label for="pincode">Enter your pincode</label>
                    </legend>
                    <input type="text" id="pincode" name="pincode" placeholder="Enter your pincode">
                </div>
            </form>
        </div>

    </form>
    <img src="Location.svg" alt="">
</body>

</html>
