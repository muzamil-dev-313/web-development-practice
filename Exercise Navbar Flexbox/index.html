<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav bar</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        ul {
            display: flex;
            justify-content: center;
            padding-right: 150px;
            margin-top: 20px;
        }

        ul li {
            list-style: none;
            padding: 30px;
        }

        img {
            padding-right: 80px;
        }

        button {
            background-color: #ffd741;
            border: none;
            height: 30px;
            width: 100px;
            margin-top: 25px;
            border-radius: 3px;
            font-weight: 500;
        }

        button:hover {
            background-color: #fce077;
            color: rgb(202, 202, 202);
            font-weight: 500;
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: black;
        }

        a:hover {
            color: rgb(11, 12, 12);
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <img width="180px" src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE_Site-Logo.png" alt="">
                <li>Products</li>
                <li>Pricing</li>
                <li>Resources</li>
                <li>About Us</li>
                <button> <a href="https://github.com/muzamil-dev-313/web-development-practice">Download</a></button>
            </ul>
        </nav>
    </header>
</body>

</html>
