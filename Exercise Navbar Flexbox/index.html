<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav bar</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        ul {
            display: flex;
            justify-content: center;
            padding-right: 150px;
            margin-top: 20px;
        }

        ul li {
            list-style: none;
            padding: 30px;
        }

        img {
            padding-right: 80px;
        }

        button {
            background-color: #ffd741;
            border: none;
            height: 30px;
            width: 100px;
            margin-top: 25px;
            border-radius: 3px;
        }

        button:hover {
            background-color: rgb(49, 167, 45);
            color: azure;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <img width="180px" src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE_Site-Logo.png" alt="">
                <li>Products</li>
                <li>Pricing</li>
                <li>Resources</li>
                <li>About Us</li>
                <button>Download</button>
            </ul>
        </nav>
    </header>
</body>

</html>
