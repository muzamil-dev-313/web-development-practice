<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: rgb(143, 137, 137);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background-color: white;
            min-height: 500px;
            width: 350px;
            border: 2px solid rgb(245, 209, 209);
            border-radius: 15px;
            padding: 5px 5px 45px 5px;
        }

        img {
            margin-bottom: 20px;
        }

        span {
            border: 2px solid black;
            border-radius: 10px;
            padding: 3px;
            margin-left: 35px;
        }

        div span:nth-child(2) {
            margin: 5px;

        }

        h2 {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            margin-left: 20px;
            margin-bottom: 10px;
        }

        p {
            margin-left: 20px;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .button {
            text-align: center;
        }

        .button button {
            padding: 15px;
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: 700;
            background-color: rgb(181, 181, 247);
        }

        .button button:hover {
            background-color: burlywood;
        }
    </style>
</head>

<body>
    <!-- card.png is a file which contains a card Image. Write html and css code to design this card. Use #html -->
    <div class="card">
        <img src="Premium-Grey-bag-350x350.png" alt="">
        <div>
            <span>Nature</span>
            <span>Lake</span>
            <h2>Lago di Braies</h2>
            <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Molestias soluta repellat quos eum deserunt
                blanditiis repellendus, natus pariatur. Adipisci repellendus cum aut nihil.</p>
            <div class="button">
                <button>Read More</button>
            </div>
        </div>
    </div>
</body>

</html>
