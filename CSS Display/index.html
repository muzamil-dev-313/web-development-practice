<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            border: 2px solid black;
            padding: 30px;
            /* display: inline-block; */
            /* width: 500px; */
            margin: 25px;
            display: flex;
            justify-content: center;
        }

        span {
            border: 2px solid blue;
            color: brown;
            display: grid;
            justify-content: center;
            align-content: space-between;
            padding: 30px;
        }

        /* .container2{
            
            display: none;
            visibility: hidden;
        } */
    </style>
</head>

<body>
    <div class="container container2">I am a container</div>
    <div class="container">I am another container</div>
    <span>I am span</span>
    <span>I am span too</span>
</body>

</html>
