<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS media query</title>
    <style>
        /* @media not|only mediatype and (expressions) {
            CSS-Code;
        } */
        body {
            background-color: black;
        }

        @media screen and (orientation: landscape) {
            body {
                border: 2px solid white;
                background-color: rgb(56, 103, 124);
            }
        }

        @media only screen and (max-width: 433px) {
            body {
                background-color: rgb(184, 127, 53);
            }

            .parent {
                flex-wrap: wrap;
                /* flex-direction: column; */
            }
        }

        div {
            color: aqua;
            display: flex;
        }

        .parent {
            display: flex;
        }

        .child {
            width: 350px;
            height: 350px;
            background-color: antiquewhite;
            margin: 5px;
            border-radius: 50px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>

            Hey, what's up bro? What are you doing?
    </div>
    </h1>
    <div class="parent">
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
    </div>
</body>

</html>
