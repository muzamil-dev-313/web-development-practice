<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Shadow & Outline</title>
    <style>
        .container{
            background-color: bisque;
            border: 2px solid brown;
            box-shadow: 4px 3px 12px 5px rgb(42, 119, 93 )inset;
            height: 100px;
            outline: 2px solid blue;
            outline-offset: 12px;
            display: grid;
            align-content: center;
            padding: 30px;
            margin-top: 20px;
            text-align: center;
        }
        div p{
            color: rgb(69, 152, 155);
            text-shadow: 7px 8px 3px black;
        }

    </style>
</head>
<body>
    <div class="container">I am a container
        <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Ratione amet voluptatibus ipsam itaque. Voluptatibus corrupti eum suscipit neque dicta praesentium iste magni quibusdam laborum eius officiis, quis eveniet veniam, ducimus nobis!
        </p>
    </div>
</body>
</html>
